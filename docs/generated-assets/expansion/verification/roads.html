<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm tra đầu nối đường mở rộng</title><style>body{font:14px system-ui;background:#e8ecdf;margin:24px;color:#243d2e}main{display:grid;grid-template-columns:repeat(4,256px);gap:20px}figure{margin:0;background:white;padding:10px;border-radius:8px}canvas{width:256px;height:160px}figcaption{font-size:12px}</style><h1>Đường mở rộng · kiểm tra hình học và xoay</h1><main id="roads"></main><script type="module">
import {EXPANSION_TILE_URIS, EXPANSION_VARIANT_URIS} from '/src/data/expansionCatalog.js';
import {drawExpansionGround,getExpansionRoadConnections} from '/src/engine/expansionRenderer.js';
const uris={...EXPANSION_TILE_URIS,...EXPANSION_VARIANT_URIS};
const ids=['r01_road_straight_ns','r02_road_straight_ew','r03_road_cross','r04_road_tee_nes','r07_road_tee_ews','r05_road_tee_nsw','r06_road_tee_ewn','r08_road_corner_ne','r09_road_corner_es','r10_road_corner_sw','r11_road_corner_wn'];
await Promise.all(ids.map(async id=>{const figure=document.createElement('figure'),canvas=document.createElement('canvas');canvas.width=256;canvas.height=160;const caption=document.createElement('figcaption');caption.textContent=id+' · '+getExpansionRoadConnections(id).join('/');figure.append(canvas,caption);document.querySelector('main').append(figure);const image=new Image();image.src=uris[id];await image.decode();const c=canvas.getContext('2d');c.translate(0,16);c.scale(2,2);c.beginPath();c.moveTo(64,0);c.lineTo(128,32);c.lineTo(64,64);c.lineTo(0,32);c.closePath();c.fillStyle='#91aa56';c.fill();drawExpansionGround(c,image,id,0,-64);}));
</script></html>
